<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerebral Cortex</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #202124;
      color: white;
      padding: 20px 30px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      color: #bbb;
      font-size: 13px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    section {
      background: white;
      border-radius: 8px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 5px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    .save-button {
      background: #222;
      color: white;
      margin-top: 15px;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .memory {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .memory-title {
      font-weight: bold;
      font-size: 16px;
    }

    .memory-meta {
      color: #666;
      font-size: 12px;
      margin-top: 5px;
    }

    .memory-content {
      margin-top: 10px;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .empty {
      color: #888;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Cerebral Cortex</h1>
  <p>Knowledge & Development Memory System</p>
</header>

<main>

  <!-- 登録 -->
  <section>
    <h2>記憶を登録</h2>

    <div class="form-grid">

      <div>
        <label>プロジェクト名</label>
        <input id="project" placeholder="例：朗読プロンプター">
      </div>

      <div>
        <label>情報の種類</label>
        <select id="type">
          <option value="制作ルール">制作ルール</option>
          <option value="コード">コード</option>
          <option value="設計">設計</option>
          <option value="仕様">仕様</option>
          <option value="決定事項">決定事項</option>
          <option value="作業履歴">作業履歴</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="full">
        <label>内容の名前</label>
        <input id="title" placeholder="例：TTS処理の仕様">
      </div>

      <div class="full">
        <label>検索キーワード</label>
        <input id="keywords" placeholder="例：TTS、音声、MP3、朗読">
      </div>

      <div class="full">
        <label>保存場所</label>
        <input id="location" placeholder="例：GitHub / projects / reading-prompter">
      </div>

      <div class="full">
        <label>内容</label>
        <textarea id="content" placeholder="ここに記憶する内容を入力"></textarea>
      </div>

    </div>

    <button class="save-button" onclick="saveMemory()">
      記憶を登録
    </button>
  </section>


  <!-- 検索 -->
  <section>
    <h2>記憶を検索</h2>

    <div class="search-box">
      <input
        id="search"
        placeholder="プロジェクト名・種類・キーワードなどで検索"
        oninput="displayMemories()"
      >
    </div>

    <div id="memoryList"></div>
  </section>

</main>


<script>

  const STORAGE_KEY = "cerebralCortexMemories";

  function getMemories() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }


  function saveMemory() {

    const memories = getMemories();

    const memory = {
      id: "M" + String(Date.now()),
      project: document.getElementById("project").value,
      type: document.getElementById("type").value,
      title: document.getElementById("title").value,
      keywords: document.getElementById("keywords").value,
      location: document.getElementById("location").value,
      content: document.getElementById("content").value,
      updated: new Date().toISOString()
    };

    if (!memory.project || !memory.title || !memory.content) {
      alert("プロジェクト名・内容の名前・内容を入力してください。");
      return;
    }

    memories.push(memory);

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(memories)
    );

    alert("記憶を登録しました。");

    document.getElementById("project").value = "";
    document.getElementById("title").value = "";
    document.getElementById("keywords").value = "";
    document.getElementById("location").value = "";
    document.getElementById("content").value = "";

    displayMemories();
  }


  function displayMemories() {

    const list = document.getElementById("memoryList");
    const search = document
      .getElementById("search")
      .value
      .toLowerCase();

    const memories = getMemories();

    const filtered = memories.filter(memory => {

      const text = [
        memory.project,
        memory.type,
        memory.title,
        memory.keywords,
        memory.content
      ]
      .join(" ")
      .toLowerCase();

      return text.includes(search);
    });


    if (filtered.length === 0) {
      list.innerHTML =
        '<div class="empty">登録された記憶はありません。</div>';
      return;
    }


    list.innerHTML = filtered
      .map(memory => `

        <div class="memory">

          <div class="memory-title">
            ${escapeHtml(memory.title)}
          </div>

          <div class="memory-meta">
            ${escapeHtml(memory.project)}
            ／
            ${escapeHtml(memory.type)}
            ／
            ${escapeHtml(memory.location)}
          </div>

          <div class="memory-content">
            ${escapeHtml(memory.content)}
          </div>

        </div>

      `)
      .join("");
  }


  function escapeHtml(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  displayMemories();

</script>

</body>
</html>
